<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc" style="background: transparent; overflow: visible;">
  <title id="title">LegalGraphRAG Architecture on TigerGraph</title>
  <desc id="desc">High-level architecture diagram showing query input, EA-GraphRAG routing, official TigerGraph GraphRAG base, legal graph schema, CommunityReport retrieval, PathRAG-light retrieval, Gemini synthesis, and benchmark outputs.</desc>
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff7e7"/>
      <stop offset="100%" stop-color="#c9f0d8"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#365146"/>
      <stop offset="100%" stop-color="#243b33"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#365146" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f8f4e"/>
    </marker>
    <style>
      .title { font: 800 54px Inter, Segoe UI, Arial, sans-serif; fill: #365146; }
      .subtitle { font: 700 21px Inter, Segoe UI, Arial, sans-serif; fill: #687a73; }
      .kicker { font: 900 17px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 2px; fill: #137c43; }
      .box-title { font: 900 25px Inter, Segoe UI, Arial, sans-serif; fill: #243b33; }
      .box-title-light { font: 900 25px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .box-text { font: 700 17px Inter, Segoe UI, Arial, sans-serif; fill: #64766f; }
      .box-text-light { font: 700 17px Inter, Segoe UI, Arial, sans-serif; fill: #e9f7ed; }
      .small { font: 800 15px Inter, Segoe UI, Arial, sans-serif; fill: #5d7169; }
      .metric { font: 900 20px Inter, Segoe UI, Arial, sans-serif; fill: #007a3d; }
      .pill { font: 900 16px Inter, Segoe UI, Arial, sans-serif; fill: #007a3d; }
      .line { stroke: #2f8f4e; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .line-soft { stroke: #7ab98e; stroke-width: 3; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 9; }
    </style>
  </defs>

  <text x="86" y="78" class="kicker">TIGERGRAPH · GRAPHRAG INFERENCE HACKATHON</text>
  <text x="86" y="140" class="title">LegalGraphRAG Architecture</text>
  <text x="86" y="180" class="subtitle">Official TigerGraph GraphRAG foundation + legal schema + routed graph retrieval + compact Gemini synthesis</text>

  <g transform="translate(955 60)">
    <rect x="0" y="0" width="140" height="44" rx="22" fill="#e4f7ea" stroke="#a8dfba"/>
    <text x="70" y="28" class="pill" text-anchor="middle">Judge 100%</text>
    <rect x="156" y="0" width="205" height="44" rx="22" fill="#e4f7ea" stroke="#a8dfba"/>
    <text x="258.5" y="28" class="pill" text-anchor="middle">BERTScore 0.9003</text>
    <rect x="377" y="0" width="240" height="44" rx="22" fill="#e4f7ea" stroke="#a8dfba"/>
    <text x="497" y="28" class="pill" text-anchor="middle">Token reduction 36.61%</text>
  </g>

  <!-- Query and router -->
  <g filter="url(#shadow)">
    <rect x="100" y="265" width="270" height="118" rx="26" fill="#ffffff" stroke="#d7e7dc"/>
    <text x="135" y="314" class="box-title">Query Input</text>
    <text x="135" y="348" class="box-text">Legal question</text>
    <text x="135" y="374" class="box-text">from benchmark or live UI</text>
  </g>

  <path class="line" d="M 370 324 C 420 324, 430 324, 482 324"/>

  <g filter="url(#shadow)">
    <rect x="490" y="250" width="330" height="148" rx="28" fill="url(#dark)" stroke="#254139"/>
    <text x="530" y="306" class="box-title-light">EA-GraphRAG Router</text>
    <text x="530" y="342" class="box-text-light">Detects query type</text>
    <text x="530" y="370" class="box-text-light">local · global · multi-hop</text>
  </g>

  <!-- Official base -->
  <g filter="url(#shadow)">
    <rect x="100" y="500" width="340" height="165" rx="30" fill="#ffffff" stroke="#b9e2c5"/>
    <text x="135" y="552" class="kicker">OFFICIAL BASE</text>
    <text x="135" y="590" class="box-title">TigerGraph GraphRAG</text>
    <text x="135" y="624" class="box-text">github.com/tigergraph/graphrag</text>
    <text x="135" y="650" class="box-text">commit f649f419</text>
  </g>

  <path class="line-soft" d="M 440 582 C 480 520, 512 445, 590 396"/>

  <!-- Branch boxes -->
  <path class="line" d="M 650 398 C 600 455, 560 500, 520 555"/>
  <path class="line" d="M 680 398 C 725 455, 770 500, 815 555"/>
  <path class="line" d="M 735 398 C 855 440, 975 485, 1095 555"/>

  <g filter="url(#shadow)">
    <rect x="500" y="535" width="300" height="165" rx="28" fill="#ffffff" stroke="#d7e7dc"/>
    <text x="535" y="587" class="box-title">Local Factual</text>
    <text x="535" y="623" class="box-text">Case + nearby chunks</text>
    <text x="535" y="651" class="box-text">Exact courts, citations, facts</text>
    <text x="535" y="679" class="metric">7/7 passed</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="845" y="535" width="300" height="165" rx="28" fill="url(#green)" stroke="#9ad9ad"/>
    <text x="880" y="587" class="box-title">Global Synthesis</text>
    <text x="880" y="623" class="box-text">CommunityReport vertices</text>
    <text x="880" y="651" class="box-text">Themes across corpus</text>
    <text x="880" y="679" class="metric">7/7 passed</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1190" y="535" width="300" height="165" rx="28" fill="#ffffff" stroke="#d7e7dc"/>
    <text x="1225" y="587" class="box-title">Multi-Hop</text>
    <text x="1225" y="623" class="box-text">Entity + citation paths</text>
    <text x="1225" y="651" class="box-text">Connected legal reasoning</text>
    <text x="1225" y="679" class="metric">6/6 passed</text>
  </g>

  <!-- Schema strip -->
  <g filter="url(#shadow)">
    <rect x="500" y="735" width="990" height="86" rx="24" fill="#ffffff" stroke="#d7e7dc"/>
    <text x="535" y="769" class="kicker">LEGAL GRAPH SCHEMA</text>
    <text x="535" y="801" class="small">LegalCase · Chunk · Citation · Entity · CommunityReport</text>
    <text x="1010" y="801" class="small">HAS_CHUNK · NEXT_CHUNK · CITES · MENTIONS · RELATED_TO</text>
  </g>

  <path class="line" d="M 650 700 C 650 720, 650 724, 650 735"/>
  <path class="line" d="M 995 700 C 995 720, 995 724, 995 735"/>
  <path class="line" d="M 1340 700 C 1340 720, 1340 724, 1340 735"/>

  <!-- Scoring and output -->
  <path class="line" d="M 995 821 C 995 852, 995 858, 995 885"/>

  <g filter="url(#shadow)">
    <rect x="675" y="855" width="640" height="88" rx="25" fill="url(#dark)" stroke="#254139"/>
    <text x="720" y="893" class="box-title-light">PathRAG-light scoring</text>
    <text x="720" y="923" class="box-text-light">relevance × edge_weight × hop_penalty</text>
  </g>

  <path class="line" d="M 1315 902 C 1370 902, 1380 902, 1430 902"/>

  <g filter="url(#shadow)">
    <rect x="1438" y="840" width="132" height="124" rx="26" fill="#ffffff" stroke="#d7e7dc"/>
    <text x="1465" y="887" class="box-title">Gemini</text>
    <text x="1465" y="919" class="box-text">Answer</text>
    <text x="1465" y="945" class="box-text">+ metrics</text>
  </g>

  <!-- Pipeline comparison footer -->
  <g transform="translate(100 835)" filter="url(#shadow)">
    <rect x="0" y="0" width="510" height="126" rx="26" fill="#ffffff" stroke="#d7e7dc"/>
    <text x="28" y="38" class="kicker">FINAL BENCHMARK</text>
    <text x="28" y="68" class="small">LLM-only: 35% judge · Basic RAG: 55% judge</text>
    <text x="28" y="92" class="small">LegalGraphRAG: 100% judge</text>
    <text x="28" y="116" class="small">GraphRAG tokens: 2,375.10 vs Basic RAG: 3,746.85</text>
  </g>
</svg>
